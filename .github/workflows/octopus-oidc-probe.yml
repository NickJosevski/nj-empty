name: Octopus OIDC probe

# Proves the full inbound OIDC path with no Octopus API key anywhere:
#   GitHub mints an ID token -> OctopusDeploy/login exchanges it at POST /token/v1
#   -> Octopus returns a 1-hour access token -> later steps use it implicitly.
on:
  workflow_dispatch:

jobs:
  login:
    runs-on: ubuntu-latest
    name: Exchange a GitHub ID token for an Octopus access token
    permissions:
      # Specifying permissions resets the job's defaults, so both are listed explicitly.
      id-token: write # required by OctopusDeploy/login to request the ID token
      contents: read

    env:
      # create-release-action resolves this by NAME only, despite the docs
      # saying "name or ID" - passing "Spaces-162" fails with
      # "No spaces exist with name 'Spaces-162'".
      OCTOPUS_SPACE: OIDC With Claude
      # The raw API calls below need the ID form.
      SPACE_ID: Spaces-162

    steps:
      - name: Log into Octopus
        uses: OctopusDeploy/login@v2
        with:
          server: https://md.octopus.app
          service_account_id: 76633d80-1bb5-4c6d-8894-c8d1f70e144d

      # login sets OCTOPUS_URL and OCTOPUS_ACCESS_TOKEN for the rest of the job.
      - name: Show which principal the token resolved to
        run: |
          echo "OCTOPUS_URL=$OCTOPUS_URL"
          echo "access token length: ${#OCTOPUS_ACCESS_TOKEN}"
          curl -sS -f \
            -H "Authorization: Bearer $OCTOPUS_ACCESS_TOKEN" \
            "$OCTOPUS_URL/api/users/me" \
          | jq '{Id, Username, DisplayName, IsService}'

      - name: Decode the access token claims (not the signature)
        run: |
          payload=$(printf '%s' "$OCTOPUS_ACCESS_TOKEN" | cut -d. -f2)
          # pad to a multiple of 4 for base64url decoding
          case $(( ${#payload} % 4 )) in
            2) payload="${payload}==" ;;
            3) payload="${payload}=" ;;
          esac
          printf '%s' "$payload" | tr '_-' '/+' | base64 -d 2>/dev/null | jq '.'

      # The real operation. No credentials passed in - it picks up
      # OCTOPUS_URL and OCTOPUS_ACCESS_TOKEN from the environment.
      - name: Create a release in Octopus
        id: create_release
        uses: OctopusDeploy/create-release-action@v4
        with:
          project: OIDC Demo
          release_number: 1.0.${{ github.run_number }}
          # git_ref / git_commit are ONLY valid for version-controlled (config-as-code)
          # projects. Passing them to a regular database project fails with:
          # "Since the provided project is not a version controlled project, the
          #  GitCommit and GitRef arguments are not supported for this command."
          # The sample workflow in the Octopus docs includes them unconditionally.

      - name: Confirm the release exists
        run: |
          echo "action output release_number=${{ steps.create_release.outputs.release_number }}"
          curl -sS -f \
            -H "Authorization: Bearer $OCTOPUS_ACCESS_TOKEN" \
            "$OCTOPUS_URL/api/$SPACE_ID/projects/oidc-demo/releases" \
          | jq '{Total: .TotalResults, Releases: [.Items[] | {Version, Assembled, LastModifiedBy}]}'
