name: Octopus Deploy Create Release
description: Buildkite Plugin to create a release in Octopus Deploy
author: https://github.com/OctopusDeploy
requirements:
  - octopus
configuration:
  properties:
    api_key:
      type: string
      description: 'An Octopus API key. Prefer the octopus-login plugin, which uses OpenID Connect and stores no secret. NOTE: this is the API key itself; earlier versions of this plugin took the NAME of an environment variable.'
    channel:
      type: string
      description: 'The name or ID of the channel to use for the new release. If omitted, the best channel will be selected.'
    debug:
      type: boolean
      default: false
      description: 'Enable debug logging for this plugin.'
    default_package_version:
      type: string
      description: 'The default version to use for all packages in this release.'
    git_ref:
      type: string
      description: 'Git branch reference to the specific resources of a version controlled Octopus project. Only valid for config-as-code projects.'
    git_commit:
      type: string
      description: 'Git commit pointing to the specific resources of a version controlled Octopus project. Only valid for config-as-code projects. If empty, uses the HEAD of git_ref.'
    ignore_channel_rules:
      type: boolean
      default: false
      description: 'Create the release ignoring any version rules specified by the channel.'
    ignore_existing:
      type: boolean
      default: false
      description: 'If a release with the same version already exists, do nothing instead of failing.'
    output_format:
      enum:
        - basic
        - json
        - table
      description: 'The output format of the octopus CLI; one of "basic", "json", or "table".'
    packages:
      type: [string, array]
      description: 'A single version or a list of versions to use for packages in the release. Format: PackageID:Version, StepName:Version, or PackageRefName:PackageOrStep:Version.'
    project:
      type: string
      description: 'The name or ID of the project associated with this release.'
    release_notes:
      type: string
      description: 'The release notes associated with the new release (Markdown is supported).'
    release_notes_file:
      type: string
      description: 'Path to a file containing release notes for the new release. Supports Markdown files.'
    release_number:
      type: string
      description: 'The version for the new release. Passed to the CLI as --version.'
    server:
      type: string
      description: 'The base URL hosting Octopus Deploy (i.e. "https://octopus.example.app"). Not needed when using the octopus-login plugin.'
    space:
      type: string
      description: 'The name or ID of a space within which this command will be executed. If omitted, the default space will be used.'
  required:
    - project
  additionalProperties: false
